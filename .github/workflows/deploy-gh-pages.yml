name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          # Clé publique (publishable) Supabase : conçue pour être exposée
          # côté client, comme n'importe quelle clé anonyme Supabase — la
          # sécurité des données repose sur les policies RLS (voir
          # supabase/schema.sql), pas sur le secret de cette valeur.
          NEXT_PUBLIC_SUPABASE_URL: "https://nqxksuxqotaxycvuztnr.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_Z5kKGj4qWW1c0dAuQK3YcA_vvLpXBte"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
